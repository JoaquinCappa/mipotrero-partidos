<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Potrero</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <h1>Organiza partidos de fútbol con Mi Potrero</h1>
    <nav>
      <button id="btnExplorar">Explorar</button>
      <button id="btnCrear">Crear</button>
      <button id="btnMios">Mis Partidos</button>
      <button id="btnLogout">Salir</button>
    </nav>
  </header>

  <main>
    <section id="login">
      <h2>Iniciar sesión</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Contraseña" />
      <button id="btnLogin">Entrar</button>
      <button id="btnRegister">Registrarse</button>
    </section>

    <section id="explorar" style="display:none">
      <h2>Partidos disponibles</h2>
      <div id="lista-partidos"></div>
    </section>

    <section id="crear" style="display:none">
      <h2>Crear Partido</h2>
      <input type="text" id="lugar" placeholder="Lugar" />
      <input type="datetime-local" id="fecha" />
      <input type="number" id="cupos" placeholder="Cantidad de jugadores" />
      <textarea id="descripcion" placeholder="Descripción"></textarea>
      <button id="btnCrearPartido">Crear</button>
    </section>

    <section id="mios" style="display:none">
      <h2>Mis Partidos</h2>
      <div id="mis-partidos"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
